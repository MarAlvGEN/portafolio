<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | NeTenebrae</title>
    <meta name="description" content="Technical write-ups on Linux, ethical hacking, and Spring Boot by Mauricio Alvarez." />
    <meta name="theme-color" content="#0F1115" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@300;500;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="bg-decoration" aria-hidden="true"><div class="bg-line-footer"></div></div>

    <main>
      <section id="blog">
        <div class="section-heading" id="blogHeading" data-i18n="blog_heading">BLOG</div>
        <div id="blogContent"></div>
      </section>
    </main>

    <script src="js/marked.min.js"></script>
    <script src="js/badges.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/components.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/blog.js"></script>
    <script>
      IconService.init().then(function() {
        new Nav('blog').render();
        new Footer().render();
        var i18n = new I18n();
        i18n.init();
        var blog = new BlogManager();
        blog.init(i18n);
      });
    </script>
  </body>
</html>
